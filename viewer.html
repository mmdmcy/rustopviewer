<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RustOp Viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #screen { width: 100vw; height: 100vh; object-fit: contain; display: block; cursor: default; user-select: none; -webkit-user-drag: none; }
  #status { position: fixed; left: 8px; bottom: 6px; font: 12px system-ui, sans-serif; color: #aaa; background: rgba(0,0,0,.55); padding: 2px 6px; border-radius: 4px; pointer-events: none; }
</style>
</head>
<body>
<img id="screen" alt="remote screen" draggable="false">
<div id="status">connecting…</div>
<script src="/viewer.js"></script>
</body>
</html>
